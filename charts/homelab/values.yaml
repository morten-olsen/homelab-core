# -- Source configuration ---------------------------------------------------
# Where ArgoCD finds the sub-charts (git repo or Helm chart repo)
source:
  repoUrl: https://github.com/morten-olsen/homelab-core.git
  targetRevision: main

# -- Platform identity -----------------------------------------------------
# Core settings passed to all sub-charts
platform:
  domain: olsen.cloud
  ip: 192.168.20.180
  gatewayAddress: "10.43.245.222"  # Istio gateway Service ClusterIP — used for STATIC ServiceEntry resolution
  additionalDomains:
    - "*.coder.olsen.cloud"
  email: ""
  timezone: Europe/Amsterdam
  acme: prod

# -- Feature flags ---------------------------------------------------------
# Each feature controls one or more operators and platform resources.
# Disabling a feature removes its operators AND the resources that depend on them.
features:
  # GitOps controller — ArgoCD (required, the deployment mechanism)
  gitops: true

  # Service mesh and ingress — Istio (base, istiod, gateways, ingress class)
  serviceMesh: true

  # TLS certificates — cert-manager, cluster issuer, wildcard certificate
  certificates: true

  # Identity and authentication — Authentik operator and server
  auth: true

  # PostgreSQL — CloudNative-PG operator and managed cluster
  postgres: true

  # MariaDB — MariaDB operator and CRDs
  mariadb: true

  # Observability — Prometheus, Grafana, Alertmanager, blackbox exporter
  monitoring: true

  # Security scanning and policy — Falco, Trivy, Kyverno
  security: true

  # Secret management — Sealed Secrets, External Secrets Operator
  secrets: true

  # Volume backup and replication — VolSync
  backup: true

  # DNS management and ad-blocking — DNS operator, Pi-hole
  dns: true

  # Cross-namespace secret/configmap reflection — Reflector
  reflection: true

  # Automatic pod restart on config changes — Reloader
  reloader: true

  # Storage class configuration
  storage: true

  # Mesh-wide authorization policies — default deny + shared service allow rules
  meshPolicy: true

  # Demo applications
  demo: true

# -- Backup configuration (when features.backup is true) -------------------
backup:
  nfs:
    server: 192.168.20.106
    path: /mnt/HDD/k8s/backups

# -- Monitoring configuration (when features.monitoring is true) -----------
monitoring:
  ntfy:
    url: http://ntfy.prod.svc.cluster.local
    topic: homelab-alerts

# -- Sub-chart value overrides ---------------------------------------------
# Escape hatch for power users. Values here are deep-merged into the
# respective sub-chart's helm values, AFTER feature-derived values.
# Use this to override operator versions, resource limits, or any
# sub-chart-specific configuration.
#
# Example:
#   overrides:
#     operators:
#       operators:
#         istiod:
#           version: "1.26.0"
#     platform:
#       resources:
#         postgresCluster:
#           instances: 3
#     monitoring:
#       monitoring:
#         prometheus-operator:
#           values:
#             prometheus:
#               prometheusSpec:
#                 retention: 60d
overrides:
  operators: {}
  platform: {}
  monitoring: {}
