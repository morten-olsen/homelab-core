{{- if .Values.features.monitoring }}
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: monitor
  namespace: argocd
spec:
  description: "Project for monitoring stack"
  sourceRepos:
    - "*"
  destinations:
    - namespace: "*"
      server: https://kubernetes.default.svc
  clusterResourceWhitelist:
    - group: "*"
      kind: "*"

---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitor
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  project: monitor
  source:
    repoURL: {{ .Values.source.repoUrl | quote }}
    targetRevision: {{ .Values.source.targetRevision | quote }}
    path: charts/monitor
    helm:
      values: |
        {{- $base := include "homelab.monitoringValues" . -}}
        {{- include "homelab.mergeOverrides" (dict "base" $base "overrides" .Values.overrides.monitoring) | nindent 8 }}
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    {{- include "homelab.syncPolicy" . | nindent 4 }}
    managedNamespaceMetadata:
      labels:
        istio.io/rev: default
        istio-injection: enabled
        homelab.mortenolsen.pro/mesh-isolation: skip
      annotations:
        volsync.backube/privileged-movers: "true"
{{- end }}
