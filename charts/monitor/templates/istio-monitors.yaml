---
# Scrape istiod control-plane metrics (port 15014)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod
  namespace: "{{ .Release.Namespace }}"
  labels:
    release: prometheus-operator
spec:
  namespaceSelector:
    matchNames:
      - istio-system
  selector:
    matchLabels:
      app: istiod
  endpoints:
    - port: http-monitoring
      interval: 30s
      path: /metrics
---
# Scrape ingress gateway Envoy metrics (container port 15090, not on Service)
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-gateway
  namespace: "{{ .Release.Namespace }}"
  labels:
    release: prometheus-operator
spec:
  namespaceSelector:
    matchNames:
      - istio-ingress
  selector:
    matchLabels:
      app: gateway
  podMetricsEndpoints:
    - port: http-envoy-prom
      interval: 15s
      path: /stats/prometheus
    # Agent health is already reachable on the pod IP, but 15020 is not a
    # declared container port. Discover the single Envoy port, then rewrite it;
    # portNumber: 15020 would silently drop this target. No Service is needed.
    - port: http-envoy-prom
      interval: 15s
      path: /metrics
      relabelings:
        - sourceLabels: [__address__]
          regex: '(.+):[0-9]+'
          targetLabel: __address__
          replacement: '${1}:15020'
      metricRelabelings:
        # The agent merges Envoy metrics; keep only its WASM health here.
        - sourceLabels: [__name__]
          regex: 'istio_agent_wasm_.*'
          action: keep
