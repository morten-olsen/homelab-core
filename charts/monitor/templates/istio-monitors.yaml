---
# Scrape istiod control-plane metrics (port 15014)
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: istiod
  namespace: "{{ .Release.Namespace }}"
  labels:
    release: prometheus-operator
spec:
  namespaceSelector:
    matchNames:
      - istio-system
  selector:
    matchLabels:
      app: istiod
  endpoints:
    - port: http-monitoring
      interval: 30s
      path: /metrics
---
# Scrape merged gateway Envoy, Coraza and agent metrics on pod port 15020
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: istio-gateway
  namespace: "{{ .Release.Namespace }}"
  labels:
    release: prometheus-operator
spec:
  namespaceSelector:
    matchNames:
      - istio-ingress
  selector:
    matchLabels:
      app: gateway
  podMetricsEndpoints:
    # Discover one declared port, then use the reachable agent endpoint. The
    # scraper's Istio sidecar captures outbound 15090 and serves its OWN stats.
    # Agent 15020 merges the actual gateway stats with WASM health; scrape once.
    # Direct portNumber: 15020 would drop the undeclared port from discovery.
    - port: http-envoy-prom
      interval: 15s
      path: /stats/prometheus
      relabelings:
        - sourceLabels: [__address__]
          regex: '(.+):[0-9]+'
          targetLabel: __address__
          replacement: '${1}:15020'
          action: replace
