apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: "grafana-private"
  namespace: "{{ .Release.Namespace }}"
spec:
  gateways:
    - "shared/private"
    - mesh
  hosts:
    - "grafana.{{ .Values.global.domain }}"
  http:
    - route:
        - destination:
            host: "prometheus-operator-grafana"
            port:
              number: 80
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: "grafana-mesh"
  namespace: "{{ .Release.Namespace }}"
spec:
  hosts:
    - "grafana.{{ .Values.global.domain }}"
  ports:
    - number: 80
      name: http
      protocol: HTTP
    - number: 443
      name: https
      protocol: HTTPS
  resolution: DNS
  location: MESH_INTERNAL
  endpoints:
    - address: gateway.istio-ingress.svc.cluster.local
      ports:
        https: 443
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: "falco-private"
  namespace: "{{ .Release.Namespace }}"
spec:
  gateways:
    - "shared/private"
    - mesh
  hosts:
    - "falco.{{ .Values.global.domain }}"
  http:
    - route:
        - destination:
            host: "falco-falcosidekick-ui.falco.svc.cluster.local"
            port:
              number: 2802
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: "falco-mesh"
  namespace: "{{ .Release.Namespace }}"
spec:
  hosts:
    - "falco.{{ .Values.global.domain }}"
  ports:
    - number: 80
      name: http
      protocol: HTTP
    - number: 443
      name: https
      protocol: HTTPS
  resolution: DNS
  location: MESH_INTERNAL
  endpoints:
    - address: gateway.istio-ingress.svc.cluster.local
      ports:
        https: 443
