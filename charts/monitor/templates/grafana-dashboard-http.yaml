---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-http-services
  namespace: "{{ .Release.Namespace }}"
  labels:
    grafana_dashboard: "1"
data:
  homelab-http-services.json: |
    {
      "title": "Homelab HTTP Services",
      "uid": "homelab-http-services",
      "description": "HTTP probe status and response times for homelab services via Blackbox Exporter",
      "tags": ["homelab", "blackbox"],
      "schemaVersion": 38,
      "refresh": "1m",
      "graphTooltip": 1,
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Services Up",
          "gridPos": { "x": 0, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "green", "mode": "fixed" },
              "unit": "none"
            }
          },
          "targets": [
            { "expr": "count(probe_success == 1) or vector(0)", "legendFormat": "", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "${datasource}" } }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Services Down",
          "gridPos": { "x": 6, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "none"
            }
          },
          "targets": [
            { "expr": "count(probe_success == 0) or vector(0)", "legendFormat": "", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "${datasource}" } }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Overall Uptime (24h)",
          "gridPos": { "x": 12, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "yellow", "value": 95 },
                  { "color": "green", "value": 99 }
                ]
              },
              "unit": "percent",
              "decimals": 2
            }
          },
          "targets": [
            { "expr": "avg(avg_over_time(probe_success[24h])) * 100", "legendFormat": "", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "${datasource}" } }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Avg Response Time",
          "gridPos": { "x": 18, "y": 0, "w": 6, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              },
              "unit": "s"
            }
          },
          "targets": [
            { "expr": "avg(probe_duration_seconds)", "legendFormat": "", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "${datasource}" } }
          ]
        },
        {
          "id": 5,
          "type": "table",
          "title": "Service Status",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 14 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "sortBy": [{ "desc": true, "displayName": "Status" }],
            "footer": { "show": false },
            "cellHeight": "sm"
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "left" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Status" },
                "properties": [
                  { "id": "custom.width", "value": 80 },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "0": { "text": "DOWN", "color": "red", "index": 0 }, "1": { "text": "UP", "color": "green", "index": 1 } } }
                    ]
                  },
                  { "id": "custom.displayMode", "value": "color-background" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Uptime 24h" },
                "properties": [
                  { "id": "unit", "value": "percent" },
                  { "id": "decimals", "value": 1 },
                  { "id": "custom.width", "value": 110 },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "red", "value": null },
                        { "color": "yellow", "value": 95 },
                        { "color": "green", "value": 99 }
                      ]
                    }
                  },
                  { "id": "custom.displayMode", "value": "color-background" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Response Time" },
                "properties": [
                  { "id": "unit", "value": "s" },
                  { "id": "custom.width", "value": 130 },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "yellow", "value": 1 },
                        { "color": "red", "value": 3 }
                      ]
                    }
                  },
                  { "id": "custom.displayMode", "value": "color-background" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "HTTP Status" },
                "properties": [{ "id": "custom.width", "value": 110 }]
              },
              {
                "matcher": { "id": "byName", "options": "Service" },
                "properties": [{ "id": "custom.width", "value": 220 }]
              }
            ]
          },
          "transformations": [
            { "id": "joinByField", "options": { "byField": "service", "mode": "outer" } },
            {
              "id": "filterFieldsByName",
              "options": {
                "include": { "names": ["service", "Value #A", "Value #B", "Value #C", "Value #D"] }
              }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "service": "Service",
                  "Value #A": "Status",
                  "Value #D": "Uptime 24h",
                  "Value #B": "Response Time",
                  "Value #C": "HTTP Status"
                },
                "indexByName": {
                  "service": 0,
                  "Value #A": 1,
                  "Value #D": 2,
                  "Value #B": 3,
                  "Value #C": 4
                }
              }
            }
          ],
          "targets": [
            {
              "expr": "label_replace(probe_success, \"service\", \"$1\", \"instance\", \"http://([^.]+).*\")",
              "legendFormat": "{{ "{{" }}service{{ "}}" }}",
              "refId": "A",
              "instant": true,
              "datasource": { "type": "prometheus", "uid": "${datasource}" }
            },
            {
              "expr": "label_replace(probe_duration_seconds, \"service\", \"$1\", \"instance\", \"http://([^.]+).*\")",
              "legendFormat": "{{ "{{" }}service{{ "}}" }}",
              "refId": "B",
              "instant": true,
              "datasource": { "type": "prometheus", "uid": "${datasource}" }
            },
            {
              "expr": "label_replace(probe_http_status_code, \"service\", \"$1\", \"instance\", \"http://([^.]+).*\")",
              "legendFormat": "{{ "{{" }}service{{ "}}" }}",
              "refId": "C",
              "instant": true,
              "datasource": { "type": "prometheus", "uid": "${datasource}" }
            },
            {
              "expr": "label_replace(avg_over_time(probe_success[24h]) * 100, \"service\", \"$1\", \"instance\", \"http://([^.]+).*\")",
              "legendFormat": "{{ "{{" }}service{{ "}}" }}",
              "refId": "D",
              "instant": true,
              "datasource": { "type": "prometheus", "uid": "${datasource}" }
            }
          ]
        },
        {
          "id": 6,
          "type": "state-timeline",
          "title": "Uptime History (24h)",
          "gridPos": { "x": 0, "y": 18, "w": 24, "h": 18 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "fillOpacity": 85,
            "rowHeight": 0.9,
            "showValue": "never",
            "spanNulls": false,
            "legend": { "displayMode": "hidden", "showLegend": false }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "lineWidth": 0, "fillOpacity": 85 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } }
              ]
            }
          },
          "targets": [
            {
              "expr": "label_replace(probe_success, \"service\", \"$1\", \"instance\", \"http://([^.]+).*\")",
              "legendFormat": "{{ "{{" }}service{{ "}}" }}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" }
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Response Time",
          "gridPos": { "x": 0, "y": 36, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"], "showLegend": true },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 1, "fillOpacity": 5 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "label_replace(probe_duration_seconds, \"service\", \"$1\", \"instance\", \"http://([^.]+).*\")",
              "legendFormat": "{{ "{{" }}service{{ "}}" }}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" }
            }
          ]
        }
      ]
    }
