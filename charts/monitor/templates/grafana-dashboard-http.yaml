---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-http-services
  namespace: "{{ .Release.Namespace }}"
  labels:
    grafana_dashboard: "1"
data:
  homelab-http-services.json: |
    {
      "title": "Homelab HTTP Services",
      "uid": "homelab-http-services",
      "description": "HTTP probe status and response times for homelab services via Blackbox Exporter",
      "tags": ["homelab", "blackbox"],
      "schemaVersion": 38,
      "refresh": "1m",
      "graphTooltip": 1,
      "time": { "from": "now-24h", "to": "now" },
      "templating": {
        "list": [
          {
            "name": "datasource",
            "type": "datasource",
            "query": "prometheus",
            "hide": 0,
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Services Up",
          "gridPos": { "x": 0, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "fixedColor": "green", "mode": "fixed" },
              "unit": "none"
            }
          },
          "targets": [
            { "expr": "count(probe_success == 1) or vector(0)", "legendFormat": "", "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" } }
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "Services Down",
          "gridPos": { "x": 4, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "red", "value": 1 }
                ]
              },
              "unit": "none"
            }
          },
          "targets": [
            { "expr": "count(probe_success == 0) or vector(0)", "legendFormat": "", "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" } }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "Avg Response Time",
          "gridPos": { "x": 8, "y": 0, "w": 4, "h": 4 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "colorMode": "background",
            "graphMode": "none",
            "reduceOptions": { "calcs": ["lastNotNull"] }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              },
              "unit": "s"
            }
          },
          "targets": [
            { "expr": "avg(probe_duration_seconds)", "legendFormat": "", "refId": "A", "datasource": { "type": "prometheus", "uid": "${datasource}" } }
          ]
        },
        {
          "id": 4,
          "type": "table",
          "title": "Service Status",
          "gridPos": { "x": 0, "y": 4, "w": 24, "h": 10 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "sortBy": [{ "desc": true, "displayName": "Status" }],
            "footer": { "show": false }
          },
          "fieldConfig": {
            "defaults": { "custom": { "align": "left" } },
            "overrides": [
              {
                "matcher": { "id": "byName", "options": "Status" },
                "properties": [
                  { "id": "custom.width", "value": 80 },
                  {
                    "id": "mappings",
                    "value": [
                      { "type": "value", "options": { "0": { "text": "DOWN", "color": "red" }, "1": { "text": "UP", "color": "green" } } }
                    ]
                  },
                  { "id": "custom.displayMode", "value": "color-background" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "Response Time" },
                "properties": [
                  { "id": "unit", "value": "s" },
                  { "id": "custom.width", "value": 120 },
                  {
                    "id": "thresholds",
                    "value": {
                      "mode": "absolute",
                      "steps": [
                        { "color": "green", "value": null },
                        { "color": "yellow", "value": 1 },
                        { "color": "red", "value": 3 }
                      ]
                    }
                  },
                  { "id": "custom.displayMode", "value": "color-background" }
                ]
              },
              {
                "matcher": { "id": "byName", "options": "HTTP Status" },
                "properties": [{ "id": "custom.width", "value": 100 }]
              },
              {
                "matcher": { "id": "byName", "options": "Service" },
                "properties": [{ "id": "custom.width", "value": 380 }]
              }
            ]
          },
          "transformations": [
            {
              "id": "joinByField",
              "options": { "byField": "instance", "mode": "outer" }
            },
            {
              "id": "organize",
              "options": {
                "renameByName": {
                  "instance": "Service",
                  "Value #A": "Status",
                  "Value #B": "Response Time",
                  "Value #C": "HTTP Status"
                },
                "excludeByName": { "Time": true, "job": true, "probe_group": true }
              }
            }
          ],
          "targets": [
            { "expr": "probe_success", "legendFormat": "{{ "{{" }}instance{{ "}}" }}", "refId": "A", "instant": true, "datasource": { "type": "prometheus", "uid": "${datasource}" } },
            { "expr": "probe_duration_seconds", "legendFormat": "{{ "{{" }}instance{{ "}}" }}", "refId": "B", "instant": true, "datasource": { "type": "prometheus", "uid": "${datasource}" } },
            { "expr": "probe_http_status_code", "legendFormat": "{{ "{{" }}instance{{ "}}" }}", "refId": "C", "instant": true, "datasource": { "type": "prometheus", "uid": "${datasource}" } }
          ]
        },
        {
          "id": 5,
          "type": "state-timeline",
          "title": "Uptime History (24h)",
          "gridPos": { "x": 0, "y": 14, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "fillOpacity": 70,
            "rowHeight": 0.85,
            "showValue": "never",
            "spanNulls": false,
            "legend": { "displayMode": "list", "placement": "bottom", "showLegend": false }
          },
          "fieldConfig": {
            "defaults": {
              "color": { "mode": "thresholds" },
              "custom": { "lineWidth": 0, "fillOpacity": 70 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "red", "value": null },
                  { "color": "green", "value": 1 }
                ]
              },
              "mappings": [
                { "type": "value", "options": { "0": { "text": "DOWN" }, "1": { "text": "UP" } } }
              ]
            }
          },
          "targets": [
            {
              "expr": "probe_success",
              "legendFormat": "{{ "{{" }}instance{{ "}}" }}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" }
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Response Time",
          "gridPos": { "x": 0, "y": 22, "w": 24, "h": 8 },
          "datasource": { "type": "prometheus", "uid": "${datasource}" },
          "options": {
            "legend": { "displayMode": "table", "placement": "right", "calcs": ["lastNotNull", "max"] },
            "tooltip": { "mode": "multi" }
          },
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "custom": { "lineWidth": 1, "fillOpacity": 5 },
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  { "color": "green", "value": null },
                  { "color": "yellow", "value": 1 },
                  { "color": "red", "value": 3 }
                ]
              }
            }
          },
          "targets": [
            {
              "expr": "probe_duration_seconds",
              "legendFormat": "{{ "{{" }}instance{{ "}}" }}",
              "refId": "A",
              "datasource": { "type": "prometheus", "uid": "${datasource}" }
            }
          ]
        }
      ]
    }
