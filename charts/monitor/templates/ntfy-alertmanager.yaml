---
apiVersion: v1
kind: ConfigMap
metadata:
  name: ntfy-alertmanager-config
  namespace: "{{ .Release.Namespace }}"
data:
  webhook.py: |
    #!/usr/bin/env python3
    """Minimal Alertmanager webhook -> ntfy bridge."""
    import json, http.server, urllib.request, os, sys

    NTFY_URL   = os.environ["NTFY_URL"]
    NTFY_TOPIC = os.environ["NTFY_TOPIC"]

    # ntfy numeric priorities
    PRIORITY = {"critical": 5, "warning": 3, "info": 2}
    TAGS     = {"critical": ["rotating_light"], "warning": ["warning"]}
    EMOJI    = {"critical": "[CRIT]", "warning": "[WARN]", "resolved": "[OK]"}

    class Handler(http.server.BaseHTTPRequestHandler):
        def log_message(self, fmt, *args):
            print(fmt % args, flush=True)

        def do_GET(self):
            self.send_response(200)
            self.end_headers()

        def do_POST(self):
            n = int(self.headers.get("Content-Length", 0))
            body = json.loads(self.rfile.read(n))
            status = body.get("status", "firing")
            for alert in body.get("alerts", []):
                labels      = alert.get("labels", {})
                annotations = alert.get("annotations", {})
                alertname   = labels.get("alertname", "Unknown")
                severity    = labels.get("severity", "info")
                namespace   = labels.get("namespace", "")
                instance    = labels.get("instance", "")
                summary     = annotations.get("summary", alertname)
                description = annotations.get("description", "")

                prefix = EMOJI.get("resolved" if status == "resolved" else severity, "[INFO]")
                title  = f"{prefix} {alertname}"
                if namespace:
                    title += f" ({namespace})"

                message = summary
                if instance and instance not in message:
                    message += f"\n{instance}"
                if description and description != summary:
                    message += f"\n\n{description}"

                # Use JSON body to avoid HTTP header latin-1 encoding limits
                payload = json.dumps({
                    "topic":    NTFY_TOPIC,
                    "title":    title,
                    "message":  message,
                    "priority": PRIORITY.get(severity, 3),
                    "tags":     TAGS.get(severity, []),
                }).encode()

                req = urllib.request.Request(
                    NTFY_URL,
                    data=payload,
                    headers={"Content-Type": "application/json"},
                    method="POST",
                )
                try:
                    urllib.request.urlopen(req, timeout=10)
                    print(f"sent: {title}", flush=True)
                except Exception as e:
                    print(f"ntfy error: {e}", file=sys.stderr, flush=True)

            self.send_response(200)
            self.end_headers()

    print(f"ntfy bridge :8080 -> {NTFY_URL} topic={NTFY_TOPIC}", flush=True)
    http.server.HTTPServer(("", 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ntfy-alertmanager
  namespace: "{{ .Release.Namespace }}"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ntfy-alertmanager
  template:
    metadata:
      labels:
        app: ntfy-alertmanager
      annotations:
        sidecar.istio.io/inject: "false"
    spec:
      containers:
        - name: ntfy-alertmanager
          image: python:3.12-alpine
          command: ["python", "/app/webhook.py"]
          env:
            - name: NTFY_URL
              value: "{{ .Values.ntfy.url }}"
            - name: NTFY_TOPIC
              value: "{{ .Values.ntfy.topic }}"
          ports:
            - containerPort: 8080
              name: http
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 30
          volumeMounts:
            - name: config
              mountPath: /app
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
      volumes:
        - name: config
          configMap:
            name: ntfy-alertmanager-config
---
apiVersion: v1
kind: Service
metadata:
  name: ntfy-alertmanager
  namespace: "{{ .Release.Namespace }}"
spec:
  selector:
    app: ntfy-alertmanager
  ports:
    - port: 8080
      targetPort: 8080
      name: http
