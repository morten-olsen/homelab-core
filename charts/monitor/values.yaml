global:
  domain: olsen.cloud
  project: monitor
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true

ntfy:
  url: http://ntfy.prod.svc.cluster.local
  topic: homelab-alerts

monitoring:
  prometheus-operator:
    enabled: true
    version: 80.13.0
    namespace: monitoring
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    values:
      # Prometheus configuration
      prometheus:
        prometheusSpec:
          retention: 30d
          retentionSize: 50GiB
          storageSpec:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 50Gi
          # Selector nil = pick up all resources regardless of labels
          serviceMonitorSelectorNilUsesHelmValues: false
          podMonitorSelectorNilUsesHelmValues: false
          ruleSelectorNilUsesHelmValues: false
          probeSelectorNilUsesHelmValues: false
          # Watch all namespaces for Probe CRDs (apps live in prod, prod-containarr, etc.)
          probeNamespaceSelector: {}
          # Resource limits
          resources:
            requests:
              cpu: 500m
              memory: 2Gi
            limits:
              cpu: 2000m
              memory: 4Gi

      # Grafana configuration
      grafana:
        enabled: true
        admin:
          existingSecret: grafana-admin
          userKey: admin-user
          passwordKey: admin-password
        persistence:
          enabled: true
          storageClassName: local-path
          size: 10Gi
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        service:
          type: ClusterIP
        podAnnotations:
          sidecar.istio.io/inject: "true"

      # Alertmanager configuration
      alertmanager:
        enabled: true
        alertmanagerSpec:
          storage:
            volumeClaimTemplate:
              spec:
                storageClassName: local-path
                accessModes: ["ReadWriteOnce"]
                resources:
                  requests:
                    storage: 10Gi
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
        config:
          global:
            resolve_timeout: 5m
          inhibit_rules:
            # Silence warnings when a critical fires for the same alert/namespace
            - source_matchers:
                - severity="critical"
              target_matchers:
                - severity="warning"
              equal: [alertname, namespace]
          route:
            group_by: [alertname, namespace]
            group_wait: 30s
            group_interval: 5m
            repeat_interval: 12h
            receiver: "null"
            routes:
              # Watchdog is a canary alert to verify the pipeline — never page on it
              - matchers:
                  - alertname="Watchdog"
                receiver: "null"
              # InfoInhibitor is a synthetic alert used to suppress info-level alerts
              - matchers:
                  - alertname="InfoInhibitor"
                receiver: "null"
              # k3s embeds controller-manager and scheduler — these alerts always fire
              - matchers:
                  - alertname=~"KubeControllerManagerDown|KubeSchedulerDown|KubeProxyDown"
                receiver: "null"
              - matchers:
                  - severity="critical"
                receiver: ntfy
                repeat_interval: 1h
              - matchers:
                  - severity="warning"
                receiver: ntfy
                repeat_interval: 4h
          receivers:
            - name: "null"
            - name: ntfy
              webhook_configs:
                - url: "http://ntfy-alertmanager.monitoring.svc.cluster.local:8080/hook"
                  send_resolved: true

      # Node exporter
      nodeExporter:
        enabled: true

      # Kube state metrics
      kubeStateMetrics:
        enabled: true

      # Default rules
      defaultRules:
        create: true
        rules:
          alertmanager: true
          etcd: false
          general: true
          k8s: true
          kubeApiserverAvailability: true
          kubeApiserverBurnrate: true
          kubeApiserverHistogram: true
          kubeApiserverSlos: true
          kubelet: true
          # k3s embeds kube-proxy, controller-manager, and scheduler — no separate pods/metrics
          kubeProxy: false
          kubePrometheusGeneral: true
          kubePrometheusNodeRecording: true
          kubernetesApps: true
          kubernetesResources: true
          kubernetesStorage: true
          kubernetesSystem: true
          kubeSchedulerAlerting: false
          kubeSchedulerRecording: false
          network: true
          node: true
          nodeExporterAlerting: true
          nodeExporterRecording: true
          prometheus: true
          prometheusOperator: true
          time: true
        # Disable specific noisy alerts not suitable for a single-node homelab.
        # Note: only disable individual alerts here if their PrometheusRule group
        # contains OTHER alerts too — otherwise the group becomes rules:null which
        # is invalid. For single-alert groups (controller-manager, scheduler, proxy)
        # use Alertmanager null routing instead (see alertmanager.config.route.routes).
        disabled:
          CPUThrottlingHigh: true  # fires constantly on JVM/interpreted workloads
          KubePodNotReady: true    # replaced by homelab rule with patient window

blackboxExporter:
  enabled: true
  version: "9.4.0"
  repoURL: https://prometheus-community.github.io/helm-charts
  chart: prometheus-blackbox-exporter
  values:
    fullnameOverride: blackbox-exporter
    config:
      modules:
        http_2xx:
          prober: http
          timeout: 10s
          http:
            valid_http_versions: ["HTTP/1.1", "HTTP/2.0"]
            valid_status_codes: []  # defaults to 2xx
            method: GET
            follow_redirects: true
            preferred_ip_protocol: ip4
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

resources:
  grafanaAdminSecret:
    enabled: true
