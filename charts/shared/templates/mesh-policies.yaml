{{- if .Values.resources.meshPolicy.enabled }}
# ============================================================================
# Default deny — mesh-wide
# All meshed pods reject traffic unless an AuthorizationPolicy allows it.
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: istio-system
spec: {}

# ============================================================================
# Gateway ingress — allow the Istio gateway to reach all meshed services.
# Traffic through VirtualService routes (e.g., app.example.com) works.
# Direct service-to-service calls are blocked unless explicitly opened.
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway-ingress
  namespace: istio-system
spec:
  rules:
    - from:
        - source:
            namespaces:
              - istio-ingress

# ============================================================================
# Monitoring — Prometheus scrapes all namespaces, components talk internally
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: istio-system
spec:
  rules:
    - from:
        - source:
            namespaces:
              - monitoring
      to:
        - operation:
            methods: ["GET"]

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-monitoring-internal
  namespace: monitoring
spec:
  rules:
    - from:
        - source:
            namespaces:
              - monitoring

# ============================================================================
# Shared namespace — internal communication + services open to all namespaces
# ============================================================================

# Intra-shared: authentik-server ↔ authentik-worker ↔ redis, pihole ↔ pihole-dns
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-shared-internal
  namespace: {{ .Release.Namespace }}
spec:
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace }}

# PostgreSQL: any meshed namespace can connect (apps use direct service calls)
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-cluster
  rules:
    - to:
        - operation:
            ports: ["5432"]

# Authentik: any meshed namespace can call (OIDC token exchange, auth checks)
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-authentik
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
  rules:
    - {}

# Pi-hole: any meshed namespace can resolve DNS
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-pihole
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: pihole
  rules:
    - {}

# Pi-hole DNS sidecar: any meshed namespace (dns-operator calls this)
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-pihole-dns
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: pihole-dns
  rules:
    - {}

# ============================================================================
# ArgoCD — internal components need to communicate
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-argocd-internal
  namespace: argocd
spec:
  rules:
    - from:
        - source:
            namespaces:
              - argocd

# ============================================================================
# System namespaces — operators that manage cross-namespace resources
# ============================================================================
{{- range list "cert-manager" "external-secrets" "sealed-secrets" "kyverno" "falco" }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-internal
  namespace: {{ . }}
spec:
  rules:
    - from:
        - source:
            namespaces:
              - {{ . }}
{{- end }}

{{- end }}
