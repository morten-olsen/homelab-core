{{- if .Values.resources.meshPolicy.enabled }}
# ============================================================================
# Gateway ingress — allow the Istio gateway to reach all meshed services
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway-ingress
  namespace: istio-system
spec:
  rules:
    - from:
        - source:
            namespaces:
              - istio-ingress

# ============================================================================
# Monitoring — scraping + internal
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: istio-system
spec:
  rules:
    - from:
        - source:
            namespaces:
              - monitoring
      to:
        - operation:
            methods: ["GET"]

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-monitoring-internal
  namespace: monitoring
spec:
  rules:
    - from:
        - source:
            namespaces:
              - monitoring

# ============================================================================
# Shared namespace — internal + open shared services
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-shared-internal
  namespace: {{ .Release.Namespace }}
spec:
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace }}

# PostgreSQL: any namespace, port 5432 only
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-cluster
  rules:
    - to:
        - operation:
            ports: ["5432"]

# Authentik: any namespace (OIDC provider)
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-authentik
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
  rules:
    - {}

# Pi-hole: allow ALL traffic including non-mesh (serves physical network DNS)
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-pihole
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: pihole
  rules:
    - {}

# Pi-hole DNS sidecar: any namespace
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-pihole-dns
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: pihole-dns
  rules:
    - {}

# ============================================================================
# System namespaces — internal communication
# ============================================================================
{{- range list "argocd" "cert-manager" "external-secrets" "sealed-secrets" "kyverno" "falco" "demo" }}
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-internal
  namespace: {{ . }}
spec:
  rules:
    - from:
        - source:
            namespaces:
              - {{ . }}
{{- end }}

{{- end }}
