{{- if .Values.resources.meshPolicy.enabled }}
# ============================================================================
# Kyverno RBAC: grant permissions to manage mesh resources.
# Uses Kyverno's label-based aggregation — no manual ClusterRoleBindings.
# ============================================================================
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kyverno:mesh-resources:edit
  labels:
    rbac.kyverno.io/aggregate-to-admission-controller: "true"
    rbac.kyverno.io/aggregate-to-background-controller: "true"
rules:
  - apiGroups: ["security.istio.io"]
    resources: ["authorizationpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.istio.io"]
    resources: ["virtualservices", "serviceentries"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["dns.homelab.mortenolsen.pro"]
    resources: ["dnsrecords"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

# ============================================================================
# Kyverno ClusterPolicy: auto-generate namespace isolation
#
# For any namespace with istio-injection=enabled that does NOT have
# homelab.mortenolsen.pro/mesh-isolation=skip, generate an Istio
# AuthorizationPolicy that blocks cross-namespace traffic except
# from the ingress gateway and monitoring (prometheus scraping).
# ============================================================================
---
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: mesh-namespace-isolation
spec:
  admission: true
  background: true
  rules:
    - name: generate-ns-isolation
      match:
        any:
          - resources:
              kinds:
                - Namespace
              selector:
                matchLabels:
                  istio-injection: enabled
      exclude:
        any:
          - resources:
              selector:
                matchLabels:
                  homelab.mortenolsen.pro/mesh-isolation: skip
      generate:
        synchronize: true
        apiVersion: security.istio.io/v1
        kind: AuthorizationPolicy
        name: ns-isolation
        namespace: "{{`{{request.object.metadata.name}}`}}"
        data:
          spec:
            action: DENY
            rules:
              - from:
                  - source:
                      notNamespaces:
                        - "{{`{{request.object.metadata.name}}`}}"
                        - monitoring
                      notPrincipals:
                        - cluster.local/ns/istio-ingress/sa/gateway

{{- if .Values.global.gatewayAddress }}
# ============================================================================
# Kyverno GeneratingPolicy: auto-generate mesh resources from VirtualServices
#
# For any VirtualService targeting the private gateway (shared/private),
# iterate over each non-mesh host and generate:
#   1. A STATIC ServiceEntry pointing to the gateway ClusterIP — for ALL hosts
#      (so wildcard + apex, or multiple discrete hosts, all get mesh routing).
#   2. A DNSRecord (A record) pointing to the cluster IP — only for hosts
#      strictly under the configured globals.domain. External-domain hosts
#      get a ServiceEntry but no DNSRecord (their public DNS resolves
#      correctly already and pi-hole shouldn't serve them).
#
# Resource naming: <vsName>-<sanitized-host>-mesh / -dns, where the host
# has '.' replaced with '-' and '*' replaced with 'wildcard'.
#
# Uses synchronize so Kyverno manages the full lifecycle — generated
# resources are created, updated, and deleted with the VirtualService.
# ============================================================================
---
apiVersion: policies.kyverno.io/v1
kind: GeneratingPolicy
metadata:
  name: mesh-virtualservice-resources
spec:
  evaluation:
    synchronize:
      enabled: true
  matchConstraints:
    resourceRules:
      - apiGroups: ['networking.istio.io']
        apiVersions: ['v1']
        operations: ['CREATE', 'UPDATE']
        resources: ['virtualservices']
  matchConditions:
    - name: uses-private-gateway
      expression: >-
        object.spec.gateways.exists(g, g == 'shared/private')
  variables:
    - name: vsName
      expression: 'object.metadata.name'
    - name: vsNamespace
      expression: 'object.metadata.namespace'
    - name: hosts
      expression: >-
        object.spec.hosts.filter(h, h != 'mesh')
    - name: globalDomain
      expression: '"{{ .Values.global.domain }}"'
    - name: ownerRef
      expression: >-
        dyn([dyn({
          "apiVersion": dyn("networking.istio.io/v1"),
          "kind": dyn("VirtualService"),
          "name": dyn(string(variables.vsName)),
          "uid": dyn(string(object.metadata.uid))
        })])
    - name: serviceEntries
      expression: >-
        variables.hosts.map(h, dyn({
          "kind": dyn("ServiceEntry"),
          "apiVersion": dyn("networking.istio.io/v1"),
          "metadata": dyn({
            "name": dyn(string(variables.vsName) + "-" + h.replace(".", "-").replace("*", "wildcard") + "-mesh"),
            "namespace": dyn(string(variables.vsNamespace)),
            "ownerReferences": variables.ownerRef
          }),
          "spec": dyn({
            "hosts": dyn([h]),
            "ports": dyn([
              dyn({"number": dyn(80), "name": dyn("http"), "protocol": dyn("HTTP")}),
              dyn({"number": dyn(443), "name": dyn("https"), "protocol": dyn("HTTPS")})
            ]),
            "resolution": dyn("STATIC"),
            "location": dyn("MESH_INTERNAL"),
            "endpoints": dyn([
              dyn({"address": dyn("{{ .Values.global.gatewayAddress }}"), "ports": dyn({"https": dyn(443)})})
            ])
          })
        }))
    - name: dnsRecords
      expression: >-
        variables.hosts.filter(h, h.endsWith("." + variables.globalDomain)).map(h, dyn({
          "kind": dyn("DNSRecord"),
          "apiVersion": dyn("dns.homelab.mortenolsen.pro/v1alpha1"),
          "metadata": dyn({
            "name": dyn(string(variables.vsName) + "-" + h.replace(".", "-").replace("*", "wildcard") + "-dns"),
            "namespace": dyn(string(variables.vsNamespace)),
            "ownerReferences": variables.ownerRef
          }),
          "spec": dyn({
            "type": dyn("A"),
            "domain": dyn(variables.globalDomain),
            "subdomain": dyn(h.substring(0, h.size() - variables.globalDomain.size() - 1)),
            "dnsClassRef": dyn({"name": dyn("private-dns")}),
            "values": dyn(["{{ .Values.global.ip }}"])
          })
        }))
  generate:
    - expression: >-
        generator.Apply(variables.vsNamespace, variables.serviceEntries + variables.dnsRecords)
{{- end }}

{{- end }}
