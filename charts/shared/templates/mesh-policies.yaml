{{- if .Values.resources.meshPolicy.enabled }}
# ============================================================================
# Default deny — mesh-wide
# All meshed pods reject traffic unless an AuthorizationPolicy allows it.
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: default-deny
  namespace: istio-system
spec: {}

# ============================================================================
# Gateway ingress — allow the Istio gateway to reach all meshed services.
# This is the primary traffic path: clients hit the public/private gateway,
# which routes via VirtualService to the target pod. Direct service-to-service
# calls (e.g., bytestash.prod.svc:80) are blocked by default.
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-gateway-ingress
  namespace: istio-system
spec:
  rules:
    - from:
        - source:
            namespaces:
              - istio-ingress

# ============================================================================
# Shared namespace — declare which services accept direct service calls
# ============================================================================

# PostgreSQL: direct connections from app namespaces (not routed via gateway)
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-postgres
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      cnpg.io/cluster: postgres-cluster
  rules:
    - from:
        - source:
            namespaces:
              {{- toYaml .Values.resources.meshPolicy.consumerNamespaces | nindent 14 }}
              - {{ .Release.Namespace }}
      to:
        - operation:
            ports: ["5432"]

# Authentik: OIDC provider — apps call it directly for token exchange
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-authentik
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: authentik
  rules:
    - from:
        - source:
            namespaces:
              {{- toYaml .Values.resources.meshPolicy.consumerNamespaces | nindent 14 }}
              - {{ .Release.Namespace }}

# Authentik Redis: internal dependency — shared namespace only
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-authentik-redis
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
      app.kubernetes.io/instance: authentik
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Release.Namespace }}

# Pi-hole: DNS resolution
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-pihole
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: pihole
  rules:
    - from:
        - source:
            namespaces:
              {{- toYaml .Values.resources.meshPolicy.consumerNamespaces | nindent 14 }}
              - {{ .Release.Namespace }}
              - monitoring

# Pi-hole DNS sidecar: HTTP API for dns-operator
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-pihole-dns
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      app: pihole-dns
  rules:
    - from:
        - source:
            namespaces:
              {{- toYaml .Values.resources.meshPolicy.consumerNamespaces | nindent 14 }}
              - {{ .Release.Namespace }}

# ============================================================================
# Monitoring — Prometheus needs to scrape all meshed namespaces,
# and monitoring components need to talk to each other
# ============================================================================
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-prometheus-scrape
  namespace: istio-system
spec:
  rules:
    - from:
        - source:
            namespaces:
              - monitoring
      to:
        - operation:
            methods: ["GET"]

---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-monitoring-internal
  namespace: monitoring
spec:
  rules:
    - from:
        - source:
            namespaces:
              - monitoring

# Ntfy: apps send notifications via direct service call
---
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: allow-ntfy
  namespace: monitoring
spec:
  selector:
    matchLabels:
      app: ntfy-alertmanager
  rules:
    - from:
        - source:
            namespaces:
              {{- toYaml .Values.resources.meshPolicy.consumerNamespaces | nindent 14 }}
              - monitoring

{{- end }}
