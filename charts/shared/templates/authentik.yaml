{{- if .Values.resources.authentik.enabled -}}
{{- $auth := .Values.resources.authentik -}}
{{- $global := .Values.global -}}
{{- if $auth.storage.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: authentik-data
  namespace: {{ .Release.Namespace }}
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ $auth.storage.storageClassName | quote }}
  resources:
    requests:
      storage: {{ $auth.storage.size | quote }}
---
{{- end }}
apiVersion: postgres.homelab.mortenolsen.pro/v1
kind: PostgresDatabase
metadata:
  name: authentik-db
  namespace: {{ .Release.Namespace }}
spec:
  clusterRef:
    name: postgres
    namespace: {{ .Release.Namespace }}
---

apiVersion: authentik.homelab.mortenolsen.pro/v1alpha1
kind: AuthentikServer
metadata:
  name: authentik
  namespace: {{ .Release.Namespace }}
spec:
  image: {{ $auth.image | quote }}
  {{- if $auth.storage.enabled }}
  dataVolumeClaimName: authentik-data
  {{- end }}
  postgresHostSecretRef:
    name: authentik-db-connection
    namespace: {{ .Release.Namespace }}
    key: host
  postgresUserSecretRef:
    name: authentik-db-connection
    namespace: {{ .Release.Namespace }}
    key: user
  postgresDatabaseSecretRef:
    name: authentik-db-connection
    namespace: {{ .Release.Namespace }}
    key: database
  postgresPasswordSecretRef:
    name: authentik-db-connection
    namespace: {{ .Release.Namespace }}
    key: password
  host: {{ $auth.subdomain }}.{{ $global.domain }}

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: "authentik-public"
  namespace: "{{ .Release.Namespace }}"
spec:
  gateways:
    - "{{ .Release.Namespace }}/public"
  hosts:
    - "{{ $auth.subdomain }}.{{ $global.domain }}"
  http:
    # Retain the pre-containment public admin and impersonation path denials.
    - match:
        - uri:
            prefix: /if/admin
        - uri:
            prefix: /administration
        - uri:
            prefix: /api/v3/admin
        - uri:
            prefix: /-/impersonation
      directResponse:
        status: 403
        body:
          string: "Forbidden"
    - route:
        - destination:
            host: "authentik"
            port:
              number: 9000

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: "authentik-private"
  namespace: "{{ .Release.Namespace }}"
spec:
  gateways:
    - "{{ .Release.Namespace }}/private"
    - mesh
  hosts:
    - "{{ $auth.subdomain }}.{{ $global.domain }}"
  http:
    - route:
        - destination:
            host: "authentik"
            port:
              number: 9000


{{- end }}
