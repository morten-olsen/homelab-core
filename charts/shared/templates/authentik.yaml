{{- if .Values.resources.authentik.enabled -}}
{{- $auth := .Values.resources.authentik -}}
{{- $global := .Values.global -}}
{{- $gwAddr := $global.gatewayAddress | default "" -}}
apiVersion: postgres.homelab.mortenolsen.pro/v1
kind: PostgresDatabase
metadata:
  name: authentik-db
  namespace: {{ .Release.Namespace }}
spec:
  clusterRef:
    name: postgres
    namespace: {{ .Release.Namespace }}
---

apiVersion: authentik.homelab.mortenolsen.pro/v1alpha1
kind: AuthentikServer
metadata:
  name: authentik
  namespace: {{ .Release.Namespace }}
spec:
  image: {{ $auth.image | quote }}
  postgresHostSecretRef:
    name: authentik-db-connection
    namespace: {{ .Release.Namespace }}
    key: host
  postgresUserSecretRef:
    name: authentik-db-connection
    namespace: {{ .Release.Namespace }}
    key: user
  postgresDatabaseSecretRef:
    name: authentik-db-connection
    namespace: {{ .Release.Namespace }}
    key: database
  postgresPasswordSecretRef:
    name: authentik-db-connection
    namespace: {{ .Release.Namespace }}
    key: password
  host: {{ $auth.subdomain }}.{{ $global.domain }}

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: "authentik-public"
  namespace: "{{ .Release.Namespace }}"
spec:
  gateways:
    - "{{ .Release.Namespace }}/public"
  hosts:
    - "{{ $auth.subdomain }}.{{ $global.domain }}"
  http:
    # Block admin paths on the public gateway — admin UI, admin API,
    # and impersonation should only be reachable from LAN/VPN.
    - match:
        - uri:
            prefix: /if/admin
        - uri:
            prefix: /administration
        - uri:
            prefix: /api/v3/admin
        - uri:
            prefix: /-/impersonation
      directResponse:
        status: 403
        body:
          string: "Forbidden"
    - route:
        - destination:
            host: "authentik"
            port:
              number: 9000

---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: "authentik-private"
  namespace: "{{ .Release.Namespace }}"
spec:
  gateways:
    - "{{ .Release.Namespace }}/private"
    - mesh
  hosts:
    - "{{ $auth.subdomain }}.{{ $global.domain }}"
  http:
    - route:
        - destination:
            host: "authentik"
            port:
              number: 9000

{{- if $gwAddr }}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: "authentik-mesh"
  namespace: "{{ .Release.Namespace }}"
spec:
  hosts:
    - "{{ $auth.subdomain }}.{{ $global.domain }}"
  ports:
    - number: 80
      name: http
      protocol: HTTP
    - number: 443
      name: https
      protocol: HTTPS
  resolution: STATIC
  location: MESH_INTERNAL
  endpoints:
    - address: {{ $gwAddr }}
      ports:
        https: 443
{{- end }}

{{- end }}
