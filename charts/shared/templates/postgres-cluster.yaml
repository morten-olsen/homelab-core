apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: postgres-cluster
  namespace: "{{ .Release.Namespace }}"
spec:
  instances: 1
  imageName: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
  storage:
    size: 10Gi
  managed:
    roles:
      - name: controller
        ensure: present
        comment: Control databases
        connectionLimit: -1
        inherit: true
        login: true
        superuser: true
        inRoles:
        - pg_monitor
        - pg_signal_backend
        passwordSecret:
          name: postgres-cluster-controller

