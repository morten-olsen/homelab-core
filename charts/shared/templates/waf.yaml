{{- /* Coraza Proxy WASM as an Istio WasmPlugin attached to the public gateway
       listener. The single gateway pod serves both public (18080/18443) and
       private (80/443) ports — by matching only the public ports here, LAN
       traffic is not inspected. Disabled by default; flip resources.waf.enabled
       to roll out. See repos/core/docs/networking.md "Web Application Firewall"
       for the rollout playbook. */ -}}
{{- if .Values.resources.waf.enabled -}}
{{- $waf := .Values.resources.waf -}}
{{- $gateway := .Values.resources.gateway -}}
{{- $public := .Values.resources.gateways.public -}}
---
apiVersion: extensions.istio.io/v1alpha1
kind: WasmPlugin
metadata:
  name: coraza-public
  namespace: {{ $gateway.namespace }}
spec:
  selector:
    matchLabels:
      istio: gateway
  url: oci://{{ $waf.image.repository }}:{{ $waf.image.tag }}
  imagePullPolicy: {{ $waf.image.pullPolicy | default "IfNotPresent" }}
  phase: AUTHN
  failStrategy: {{ $waf.failStrategy | default "FAIL_OPEN" }}
  match:
    - mode: SERVER
      ports:
        - number: {{ $public.httpPort }}
        - number: {{ $public.httpsPort }}
  pluginConfig:
    default_directives: default
    directives_map:
      default:
{{ toYaml $waf.directives | indent 8 }}
{{- with $waf.perAuthorityDirectives }}
    per_authority_directives:
{{ toYaml . | indent 6 }}
{{- end }}
    metric_labels:
      owner: homelab
      identifier: public-gateway
{{- end }}
