{{- /* Deploys the Istio gateway pod via ArgoCD Application. This single gateway
       handles both public and private traffic on separate port pairs. The Gateway
       CRs (public-gateway.yaml, private-gateway.yaml) bind TLS to these ports. */ -}}
{{- if .Values.resources.gateway.enabled -}}
{{- $global := .Values.global -}}
{{- $gateway := .Values.resources.gateway -}}
{{- $gateways := .Values.resources.gateways -}}
{{- $syncPolicy := default $global.syncPolicy $gateway.syncPolicy -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gateway
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: {{ $gateway.namespace }}
    server: https://kubernetes.default.svc
  project: {{ $global.project }}
  source:
    repoURL: https://istio-release.storage.googleapis.com/charts
    targetRevision: {{ $gateway.version }}
    chart: gateway
    helm:
      values: |
        service:
          ports:
            - name: status-port
              port: 15021
              targetPort: 15021
              protocol: TCP
            - name: http2
              port: {{ $gateways.private.httpPort }}
              targetPort: {{ $gateways.private.httpPort }}
              protocol: TCP
            - name: https
              port: {{ $gateways.private.httpsPort }}
              targetPort: {{ $gateways.private.httpsPort }}
              protocol: TCP
            - name: http-public
              port: {{ $gateways.public.httpPort }}
              targetPort: {{ $gateways.public.httpPort }}
              protocol: TCP
            - name: https-public
              port: {{ $gateways.public.httpsPort }}
              targetPort: {{ $gateways.public.httpsPort }}
              protocol: TCP
  syncPolicy:
    {{- toYaml $syncPolicy | nindent 4 }}
{{- end }}
