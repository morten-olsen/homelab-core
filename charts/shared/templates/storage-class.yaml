{{- /* Shared guard for CI setup and deletion. Only the parent is host-mounted
       in the provisioner's helper pod; the marker was created on the disk. */ -}}
{{- define "homelab-shared.ci-volume-guard" -}}
CI_ROOT={{ .ci.path | squote }}
CI_UUID={{ required "CI filesystem UUID is required" .ci.filesystemUUID | squote }}
case "$VOL_DIR" in
  "$CI_ROOT"/*)
    CI_NAME=${VOL_DIR#"$CI_ROOT"/}
    if ! printf '%s\n' "$CI_NAME" | grep -Eq '^pvc-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}_woodpecker-ci_[a-z0-9.-]+$' ||
       [ -L "$VOL_DIR" ] || [ -L "$CI_ROOT/.filesystem-uuid" ] ||
       [ "$(cat "$CI_ROOT/.filesystem-uuid" 2>/dev/null)" != "$CI_UUID" ]; then
      echo "Error: Refusing CI volume with an unexpected path or missing disk marker" >&2
      exit 1
    fi
    ;;
esac
{{- end -}}
{{- /* Manages the k3s local-path StorageClass and its ConfigMap. The setup script
       creates human-readable symlinks at /var/lib/rancher/k3s/storage/pvc/<ns>/<name>
       so PVC data is easy to find on the host filesystem. */ -}}
{{- if .Values.resources.storageClass.enabled -}}
{{- $storage := .Values.resources.storageClass -}}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: local-path
  annotations:
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---

apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: woodpecker-ci
provisioner: rancher.io/local-path
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Delete

---

apiVersion: v1
kind: ConfigMap
metadata:
  name: local-path-config
  namespace: kube-system
data:
  config.json: |-
    {
      "nodePathMap":[],
      "storageClassConfigs":{
        "local-path":{
          "nodePathMap":[{
            "node":"DEFAULT_PATH_FOR_NON_LISTED_NODES",
            "paths":{{ list $storage.path | toJson }}
          }]
        },
        "woodpecker-ci":{
          "nodePathMap":[{
            "node":{{ $storage.ci.node | toJson }},
            "paths":{{ list $storage.ci.path | toJson }}
          }]
        }
      }
    }
  setup: |-
    #!/bin/sh
    set -eu

    {{- include "homelab-shared.ci-volume-guard" $storage | nindent 4 }}
    case "$VOL_DIR" in
      "$CI_ROOT"/*)
        mkdir -m 0777 -p "$VOL_DIR"
        exit 0
        ;;
    esac
    PVC_ROOT={{ printf "%s/pvc" $storage.path | squote }}
    NVME_ROOT={{ $storage.path | squote }}
    case "$VOL_DIR" in
      "$NVME_ROOT"/pvc-*)
        if ! printf '%s\n' "${VOL_DIR#"$NVME_ROOT"/}" | grep -Eq '^pvc-[0-9a-f-]+_[a-z0-9-]+_[a-z0-9][a-z0-9.-]*$'; then
          echo "Error: Refusing unexpected local-path volume" >&2; exit 1
        fi
        ;;
      *) echo "Error: Refusing unexpected local-path volume" >&2; exit 1 ;;
    esac

    if [ -z "${PVC_NAMESPACE:-}" ] || [ -z "${PVC_NAME:-}" ]; then
      if [ -n "${VOL_DIR:-}" ]; then
        VOL_BASENAME=$(basename "$VOL_DIR")
        NAMESPACE_PART=$(echo "$VOL_BASENAME" | cut -d'_' -f2)
        NAME_PART=$(echo "$VOL_BASENAME" | cut -d'_' -f3-)
        if [ -n "$NAMESPACE_PART" ] && [ -n "$NAME_PART" ]; then
          PVC_NAMESPACE="$NAMESPACE_PART"
          PVC_NAME="$NAME_PART"
        fi
      fi
    fi

    if [ -z "${PVC_NAMESPACE:-}" ] || [ -z "${PVC_NAME:-}" ]; then
      echo "Error: Could not determine PVC_NAMESPACE or PVC_NAME"
      echo "VOL_DIR: ${VOL_DIR:-not set}"
      env | grep -E "(PVC_|PV_|VOL_)" || echo "  (none found)"
      exit 1
    fi

    PRETTY_PATH="$PVC_ROOT/${PVC_NAMESPACE}/${PVC_NAME}"
    mkdir -p "$PRETTY_PATH"
    chmod 777 "$PRETTY_PATH"
    ln -s "$PRETTY_PATH" "$VOL_DIR"
  teardown: |-
    #!/bin/sh
    set -eu

    {{- include "homelab-shared.ci-volume-guard" $storage | nindent 4 }}
    case "$VOL_DIR" in
      "$CI_ROOT"/*)
        rm -rf -- "$VOL_DIR"
        exit 0
        ;;
    esac
    PVC_ROOT={{ printf "%s/pvc" $storage.path | squote }}
    NVME_ROOT={{ $storage.path | squote }}
    case "$VOL_DIR" in
      "$NVME_ROOT"/pvc-*)
        if ! printf '%s\n' "${VOL_DIR#"$NVME_ROOT"/}" | grep -Eq '^pvc-[0-9a-f-]+_[a-z0-9-]+_[a-z0-9][a-z0-9.-]*$'; then
          echo "Error: Refusing unexpected local-path volume" >&2; exit 1
        fi
        ;;
      *) echo "Error: Refusing unexpected local-path volume" >&2; exit 1 ;;
    esac

    if [ -L "$VOL_DIR" ]; then
      PRETTY_PATH=$(readlink "$VOL_DIR")
      RELATIVE_PATH=${PRETTY_PATH#"$PVC_ROOT"/}
      NAMESPACE_PART=${RELATIVE_PATH%%/*}
      NAME_PART=${RELATIVE_PATH#*/}

      if [ "$RELATIVE_PATH" = "$PRETTY_PATH" ] ||
         [ -z "$NAMESPACE_PART" ] ||
         [ -z "$NAME_PART" ] ||
         [ "$NAME_PART" != "${NAME_PART#*/}" ] ||
         ! printf '%s\n' "$RELATIVE_PATH" | grep -Eq '^[a-z0-9-]+/[a-z0-9][a-z0-9.-]*$'; then
        echo "Error: Refusing to remove unexpected local-path target: $PRETTY_PATH"
        exit 1
      fi

      rm -rf -- "$PRETTY_PATH"
      rm -- "$VOL_DIR"
    elif [ -d "$VOL_DIR" ]; then
      case "$VOL_DIR" in
        {{ $storage.path | squote }}/pvc-*)
          rm -rf -- "$VOL_DIR"
          ;;
        *)
          echo "Error: Refusing to remove unexpected local-path volume: $VOL_DIR"
          exit 1
          ;;
      esac
    fi
  helperPod.yaml: |-
    apiVersion: v1
    kind: Pod
    metadata:
      name: helper-pod
    spec:
      containers:
      - name: helper-pod
        image: busybox
        imagePullPolicy: IfNotPresent
{{- end }}
