{{- /* Reusable MariaDB instance template. Not included by any template in this chart
       — available for future use when a service needs a MariaDB database. The
       mariadb-secrets.yaml generates the root password referenced here. */ -}}
{{- define "homelab-shared.mariadb" -}}
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb
spec:
  rootPasswordSecretKeyRef:
    name: mariadb-root-password
    key: password

  passwordSecretKeyRef:
    name: mariadb-password
    key: password
    generate: true

  myCnf: |
    [mariadb]
    bind-address=*
    default_storage_engine=InnoDB
    binlog_format=row
    innodb_autoinc_lock_mode=2
    innodb_buffer_pool_size=1600M
    max_allowed_packet=256M
  storage:
    size: 1Gi

  resources:
    requests:
      cpu: 300m
      memory: 128Mi
    limits:
      memory: 2Gi
{{- end }}
