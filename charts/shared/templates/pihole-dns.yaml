{{- if .Values.resources.piholeDns.enabled -}}
{{- $dns := .Values.resources.piholeDns -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: "pihole-dns"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: "pihole-dns"
spec:
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: "pihole-dns"
  template:
    metadata:
      labels:
        app: "pihole-dns"
    spec:
      containers:
        - name: "pihole-dns"
          image: "{{ $dns.image.repository }}:{{ $dns.image.tag }}"
          imagePullPolicy: "{{ $dns.image.pullPolicy }}"
          ports:
            - containerPort: 7100
              name: http
          env:
            - name: PIHOLE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pihole-password
                  key: password
            - name: PIHOLE_URL
              value: 'http://pihole-http.{{ .Release.Namespace }}.svc.cluster.local:80'
            - name: HMAC_SECRET
              valueFrom:
                secretKeyRef:
                  name: pihole-dns-hmac-secret
                  key: hmac-secret
---

apiVersion: v1
kind: Service
metadata:
  name: "pihole-dns-http"
  namespace: "{{ .Release.Namespace }}"
  labels:
    app: "pihole-dns"
spec:
  type: ClusterIP
  ports:
    - port: 7100
      targetPort: 7100
      protocol: TCP
      name: http
  selector:
    app: "pihole-dns"

---

apiVersion: dns.homelab.mortenolsen.pro/v1alpha1
kind: DNSClass
metadata:
  name: private-dns
  namespace: "{{ .Release.Namespace }}"
spec:
  server: "http://pihole-dns-http.{{ .Release.Namespace }}.svc.cluster.local:7100"
  defaultTTL: 300
  timeoutSeconds: 30
  hmacAuth:
    secretRef:
      name: pihole-dns-hmac-secret
      namespace: "{{ .Release.Namespace }}"
      key: hmac-secret
{{- end }}
