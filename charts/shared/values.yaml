global:
  project: shared
  domain: ""
  ip: ""
  additionalDomains: []
  email: ""
  timezone: UTC
  acme: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true

resources:
  # -- Networking -----------------------------------------------------------

  ingressClass:
    enabled: true

  gateway:
    enabled: true
    version: 1.31.1
    namespace: istio-ingress
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        memory: 2Gi
    # One node: a second Envoy adds no capacity (each uses every core), and an 80%
    # target on a 100m request flapped between 1 and 5 replicas at ~80m of use.
    autoscaling:
      enabled: false
    replicaCount: 1
    # Local keeps the client source address: with Cluster, kube-proxy masquerades
    # traffic to the LoadBalancer IP and every client reaches Envoy (and, via
    # X-Forwarded-For, every app) as the node's cni0 address 10.42.0.1. One node
    # means Local loses no traffic. Home Assistant banned 10.42.0.1 for everyone
    # on 2026-10-16 and 2026-10-21 because of this.
    externalTrafficPolicy: Local

  gateways:
    public:
      enabled: true
      httpPort: 18080
      httpsPort: 18443
    private:
      enabled: true
      httpPort: 80
      httpsPort: 443

  # -- Web Application Firewall --------------------------------------------
  # Coraza Proxy WASM, attached to public gateway CLIENT listeners only.
  # DetectionOnly + FAIL_OPEN until representative burn-in is reviewed and
  # Morten approves enforcement. See docs/networking.md "Web Application Firewall (WAF)".

  waf:
    enabled: true
    failStrategy: FAIL_OPEN
    image:
      repository: ghcr.io/corazawaf/coraza-proxy-wasm
      tag: "0.6.0"
      pullPolicy: IfNotPresent
    directives:
      - "Include @demo-conf"
      - "Include @crs-setup-conf"
      - "Include @owasp_crs/*.conf"
      - "SecRuleEngine DetectionOnly"
    # perAuthorityDirectives:
    #   noisy.app.example.com: relaxed

  # -- TLS ------------------------------------------------------------------

  certIssuer:
    enabled: true
    cloudflare:
      enabled: true

  certificate:
    enabled: true
    secretName: wildcard-tls

  # -- Storage --------------------------------------------------------------

  storageClass:
    enabled: true
    path: /var/lib/rancher/k3s/storage
    helperImage: busybox:1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
    # General SSD, with a CI subfolder; see docs/ci-storage.md before enabling on a new host.
    ci:
      node: compute
      path: /mnt/ssd/woodpecker-ci
      filesystemUUID: b8566ede-b661-4074-8b5a-f2dc743d6aee

  # -- DNS & Ad Blocking ----------------------------------------------------

  pihole:
    enabled: true
    subdomain: pihole
    image:
      repository: pihole/pihole
      tag: latest
      pullPolicy: IfNotPresent
    storage:
      size: 1Gi
      storageClassName: local-path
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  piholeDns:
    enabled: true
    image:
      repository: ghcr.io/morten-olsen/homelab-dns-pihole
      tag: latest
      pullPolicy: IfNotPresent

  # -- Databases ------------------------------------------------------------

  postgresCluster:
    enabled: true
    instances: 1
    # Pooled clients continuously reconnect during smart shutdown, so waiting
    # the default three minutes cannot drain this shared application cluster.
    smartShutdownTimeout: 30
    image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
    postgresql:
      parameters:
        # Shared application pools already consume roughly 90 connections.
        max_connections: "200"
    storage:
      size: 10Gi
      storageClassName: local-path

  mariadb:
    enabled: true

  # -- Authentication -------------------------------------------------------

  authentik:
    enabled: true
    subdomain: auth
    # Shared server/worker uploads; retained on Helm/ArgoCD deletion, not backed up automatically.
    storage:
      enabled: true
      size: 1Gi
      storageClassName: local-path
    # Semantic access groups. Resource names refer to separate, nonprivileged
    # gitops/<namespace>/<name> backing groups, never existing Authentik groups.
    groups:
      admin:
        members:
          # Existing Authentik user morten; this grants application access only.
          - id: 7
            uuid: d8359fc2-7656-45d2-a22e-5cbd13cb941f
    # Keypair for clients whose tokens are verified against the JWKS.
    signingKeyName: authentik Self-signed Certificate
    # ArgoCD login, admin group only (core chart argocdSso holds its config).
    argocdClient:
      enabled: false
      subdomain: argocd
    # kubectl login, admin group only; the API server config is on the host.
    kubernetesClient:
      enabled: false
    image: ghcr.io/goauthentik/server:2026.8.5
    tls:
      enabled: true
      secretName: wildcard-tls

  # -- Workflow orchestration -----------------------------------------------

  temporal:
    enabled: false
    subdomain: temporal
    image:
      repository: temporalio/auto-setup
      tag: 1.29.7
    bootstrapImage: postgres:18-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    ui:
      image:
        repository: temporalio/ui
        tag: 2.54.1
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

  # -- Mesh Policy ----------------------------------------------------------

  meshPolicy:
    enabled: false

  # -- Backups --------------------------------------------------------------

  backups:
    enabled: true
    # When true, a Kyverno ClusterPolicy auto-creates the per-source NFS
    # subdirectory whenever a ReplicationSource is created. Avoids stuck
    # mover pods on first sync after adding a new backup.
    autoMkdir:
      enabled: true
      # Image used by the generated mkdir Job. Needs `mkdir` only.
      image: busybox:1.38.0
    nfs:
      server: ""
      path: ""
    postgresLogical:
      schedule: "0 3 * * *"
      # Local-only plaintext staging; restic encrypts before writing to NFS.
      # local-path requests are not enforced disk quotas.
      storageSize: 20Gi
      resticImage: restic/restic:0.18.1@sha256:39d9072fb5651c80d75c7a811612eb60b4c06b32ffe87c2e9f3c7222e1797e76
      # Bound Go compression workers on the 20-core node, and leave memory
      # outside the soft Go heap target under the uploader's hard limit.
      gomaxprocs: 2
      goMemoryLimit: 384MiB
      retain:
        daily: 7
        weekly: 4
        monthly: 3
      dumpResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
      uploadResources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          memory: 512Mi
    sources:
      pihole:
        pvcName: pihole-data
        schedule: "0 2 * * *"
        retain:
          daily: 7
          weekly: 4
          monthly: 3
