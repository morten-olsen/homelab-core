global:
  project: shared
  domain: ""
  ip: ""
  additionalDomains: []
  email: ""
  timezone: UTC
  acme: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true

resources:
  # -- Networking -----------------------------------------------------------

  ingressClass:
    enabled: true

  gateway:
    enabled: true
    version: 1.30.0
    namespace: istio-ingress

  gateways:
    public:
      enabled: true
      httpPort: 18080
      httpsPort: 18443
    private:
      enabled: true
      httpPort: 80
      httpsPort: 443

  # -- Web Application Firewall --------------------------------------------
  # Coraza Proxy WASM, attached to the public gateway listener only. Disabled
  # by default; rollout is detection-only first, then SecRuleEngine On +
  # FAIL_CLOSE. See docs/networking.md "Web Application Firewall (WAF)".

  waf:
    enabled: true
    failStrategy: FAIL_OPEN
    image:
      repository: ghcr.io/corazawaf/coraza-proxy-wasm
      tag: "0.6.0"
      pullPolicy: IfNotPresent
    directives:
      - "Include @demo-conf"
      - "Include @crs-setup-conf"
      - "Include @owasp_crs/*.conf"
      - "SecRuleEngine DetectionOnly"
    # perAuthorityDirectives:
    #   noisy.app.example.com: relaxed

  # -- TLS ------------------------------------------------------------------

  certIssuer:
    enabled: true
    cloudflare:
      enabled: true

  certificate:
    enabled: true
    secretName: wildcard-tls

  # -- Storage --------------------------------------------------------------

  storageClass:
    enabled: true

  # -- DNS & Ad Blocking ----------------------------------------------------

  pihole:
    enabled: true
    subdomain: pihole
    image:
      repository: pihole/pihole
      tag: latest
      pullPolicy: IfNotPresent
    storage:
      size: 1Gi
      storageClassName: local-path
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  piholeDns:
    enabled: true
    image:
      repository: ghcr.io/morten-olsen/homelab-dns-pihole
      tag: latest
      pullPolicy: IfNotPresent

  # -- Databases ------------------------------------------------------------

  postgresCluster:
    enabled: true
    instances: 1
    image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
    storage:
      size: 10Gi
      storageClassName: local-path

  mariadb:
    enabled: true

  # -- Authentication -------------------------------------------------------

  authentik:
    enabled: true
    subdomain: auth
    image: ghcr.io/goauthentik/server:2026.5.2
    tls:
      enabled: true
      secretName: wildcard-tls

  # -- Workflow orchestration -----------------------------------------------

  temporal:
    enabled: false
    subdomain: temporal
    image:
      repository: temporalio/auto-setup
      tag: 1.29.6
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    ui:
      image:
        repository: temporalio/ui
        tag: 2.50.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

  # -- Mesh Policy ----------------------------------------------------------

  meshPolicy:
    enabled: false

  # -- Backups --------------------------------------------------------------

  backups:
    enabled: true
    # When true, a Kyverno ClusterPolicy auto-creates the per-source NFS
    # subdirectory whenever a ReplicationSource is created. Avoids stuck
    # mover pods on first sync after adding a new backup.
    autoMkdir:
      enabled: true
      # Image used by the generated mkdir Job. Needs `mkdir` only.
      image: busybox:1.38.0
    nfs:
      server: ""
      path: ""
    sources:
      pihole:
        pvcName: pihole-data
        schedule: "0 2 * * *"
        retain:
          daily: 7
          weekly: 4
          monthly: 3
      postgres:
        pvcName: postgres-cluster-1
        schedule: "0 3 * * *"
        retain:
          daily: 7
          weekly: 4
          monthly: 3
