global:
  project: shared
  domain: olsen.cloud
  additional-domains: ["*.coder.olsen.cloud"]
  email:
  acme: prod
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true

resources:
  pihole:
    subdomain: pihole
    image:
      repository: pihole/pihole
      tag: latest
      pullPolicy: IfNotPresent

  pihole-dns:
    image:
      repository: ghcr.io/morten-olsen/homelab-dns-pihole
      tag: latest
      pullPolicy: IfNotPresent

  ingressClass:
    enabled: true

  gateway:
    enabled: true
    version: 1.28.2
    namespace: istio-ingress

  certIssuer:
    enabled: true
    cloudflare:
      enabled: true

  certificate:
    enabled: true
    secretName: wildcard-tls

  postgresCluster:
    enabled: true

  authentik:
    enabled: true
    subdomain: auth
    tls:
      enabled: true
      secretName: wildcard-tls

  backups:
    enabled: true
    nfs:
      server: 192.168.20.106
      path: /mnt/HDD/k8s/backups
    sources:
      pihole:
        pvcName: pihole-data
        schedule: "0 2 * * *"
        retain:
          daily: 7
          weekly: 4
          monthly: 3
      postgres:
        pvcName: postgres-cluster-1
        schedule: "0 3 * * *"
        retain:
          daily: 7
          weekly: 4
          monthly: 3

  gateways:
    public:
      enabled: true
      httpPort: 18080
      httpsPort: 18443
    private:
      enabled: true
      httpPort: 80
      httpsPort: 443
