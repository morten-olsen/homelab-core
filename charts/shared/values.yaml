global:
  project: shared
  domain: ""
  ip: ""
  additionalDomains: []
  email: ""
  timezone: UTC
  acme: staging
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true

resources:
  # -- Networking -----------------------------------------------------------

  ingressClass:
    enabled: true

  gateway:
    enabled: true
    version: 1.29.1
    namespace: istio-ingress

  gateways:
    public:
      enabled: true
      httpPort: 18080
      httpsPort: 18443
    private:
      enabled: true
      httpPort: 80
      httpsPort: 443

  # -- TLS ------------------------------------------------------------------

  certIssuer:
    enabled: true
    cloudflare:
      enabled: true

  certificate:
    enabled: true
    secretName: wildcard-tls

  # -- Storage --------------------------------------------------------------

  storageClass:
    enabled: true

  # -- DNS & Ad Blocking ----------------------------------------------------

  pihole:
    enabled: true
    subdomain: pihole
    image:
      repository: pihole/pihole
      tag: latest
      pullPolicy: IfNotPresent
    storage:
      size: 1Gi
      storageClassName: local-path
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 512Mi

  piholeDns:
    enabled: true
    image:
      repository: ghcr.io/morten-olsen/homelab-dns-pihole
      tag: latest
      pullPolicy: IfNotPresent

  # -- Databases ------------------------------------------------------------

  postgresCluster:
    enabled: true
    instances: 1
    image: ghcr.io/cloudnative-pg/postgresql:18-standard-trixie
    storage:
      size: 10Gi
      storageClassName: local-path

  mariadb:
    enabled: true

  # -- Authentication -------------------------------------------------------

  authentik:
    enabled: true
    subdomain: auth
    image: ghcr.io/goauthentik/server:2026.2.1
    tls:
      enabled: true
      secretName: wildcard-tls

  # -- Workflow orchestration -----------------------------------------------

  temporal:
    enabled: false
    subdomain: temporal
    image:
      repository: temporalio/auto-setup
      tag: 1.28.1
    resources:
      requests:
        cpu: 100m
        memory: 256Mi
      limits:
        memory: 1Gi
    ui:
      image:
        repository: temporalio/ui
        tag: 2.40.0
      resources:
        requests:
          cpu: 50m
          memory: 64Mi
        limits:
          memory: 256Mi

  # -- Mesh Policy ----------------------------------------------------------

  meshPolicy:
    enabled: false

  # -- Backups --------------------------------------------------------------

  backups:
    enabled: true
    nfs:
      server: ""
      path: ""
    sources:
      pihole:
        pvcName: pihole-data
        schedule: "0 2 * * *"
        retain:
          daily: 7
          weekly: 4
          monthly: 3
      postgres:
        pvcName: postgres-cluster-1
        schedule: "0 3 * * *"
        retain:
          daily: 7
          weekly: 4
          monthly: 3
