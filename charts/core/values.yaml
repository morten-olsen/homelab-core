global:
  project: core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true

operators:
  authentik:
    enabled: true
    version: 0.0.15
    namespace: authentik
    repoURL: https://mortenolsen.pro/homelab-authentik-operator
    chart: authentik-operator

  cert-manager:
    enabled: true
    version: v1.20.0
    namespace: cert-manager
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    path: .
    values:
      crds:
        enabled: true
      extraArgs:
        - --dns01-recursive-nameservers-only
        - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53

  external-secrets:
    enabled: true
    version: 2.2.0
    namespace: external-secrets
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    values:
      installCRDs: true

  cloudnative-pg:
    enabled: true
    version: 0.27.1
    namespace: cloudnative-pg
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg

  falco:
    enabled: false
    version: 8.0.1
    namespace: falco
    repoURL: https://falcosecurity.github.io/charts
    chart: falco

  mariadb-crds:
    enabled: true
    version: 26.3.0
    namespace: mariadb
    repoURL: https://helm.mariadb.com/mariadb-operator
    chart: mariadb-operator-crds

  mariadb-operator:
    enabled: true
    version: 26.3.0
    namespace: mariadb
    repoURL: https://helm.mariadb.com/mariadb-operator
    chart: mariadb-operator

  dns-operator:
    enabled: true
    version: 0.0.3
    namespace: falco
    repoURL: https://morten-olsen.github.io/homelab-dns-operator
    chart: dns-operator

  istio-base:
    enabled: true
    version: 1.29.1
    namespace: istio-system
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    values:
      defaultRevision: default
      profile: ambient
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istiod-default-validator
        jqPathExpressions:
          - .webhooks[]?.failurePolicy

  istiod:
    enabled: true
    version: 1.29.1
    namespace: istio-system
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    values:
      meshConfig:
        # Enable Ingress support - Istio will handle Kubernetes Ingress resources
        # The gateway service is in the shared namespace (created by gateway chart)
        # Format: namespace/service-name (required when gateway is in different namespace than istio-system)
        ingressService: shared/istio-gateway
        # Match gateway pods with label istio=gateway (matches Gateway CR selector)
        # This tells Istio which gateway pods to use for ingress traffic
        ingressSelector: gateway
        # Enable DNS proxy to intercept DNS queries for mesh-internal hostnames
        # This ensures Istio intercepts DNS queries before they reach public DNS
        defaultConfig:
          proxyMetadata:
            # Enable DNS capture - Istio sidecar will intercept DNS queries
            ISTIO_META_DNS_CAPTURE: "true"
            # DNS auto allocate - automatically assign virtual IPs for ServiceEntry hosts
            ISTIO_META_DNS_AUTO_ALLOCATE: "true"
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istio-validator-istio-system
        jqPathExpressions:
          - .webhooks[]?.failurePolicy

  kyverno:
    enabled: true
    version: 3.7.1
    namespace: kyverno
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno

  nuclei:
    enabled: false
    version: 0.2.9
    namespace: "{{ .Release.Namespace }}"
    repoURL: https://morten-olsen.github.io/homelab-nuclei-operator
    chart: nuclei-operator

  longhorn:
    enabled: false
    version: 1.11.1
    namespace: longhorn
    repoURL: https://charts.longhorn.io
    chart: longhorn
    values:
      defaultSettings:
        defaultReplicaCount: 1
        priorityClass: high-priority

  postgres:
    enabled: true
    version: 0.0.18
    namespace: postgres
    repoURL: https://mortenolsen.pro/homelab-postgres-operator
    chart: postgres-operator

  reflector:
    enabled: true
    version: 10.0.21
    namespace: reflector
    repoURL: oci://ghcr.io/emberstack/helm-charts/reflector
    path: .

  reloader:
    enabled: true
    version: 2.2.7
    namespace: reloader
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader

  sealed-secrets:
    enabled: true
    version: 2.18.4
    namespace: sealed-secrets
    repoURL: https://bitnami-labs.github.io/sealed-secrets
    chart: sealed-secrets

  trivy:
    enabled: true
    version: 0.32.1
    namespace: trivy
    repoURL: https://aquasecurity.github.io/helm-charts
    chart: trivy-operator
    values:
      serviceMonitor:
        enabled: true
      service:
        headless: false
      trivy:
        resources:
          limits:
            memory: 1Gi

  volsync:
    enabled: true
    version: 0.15.0
    namespace: volsync-system
    repoURL: https://backube.github.io/helm-charts
    chart: volsync
    values:
      metrics:
        disableAuth: true
