global:
  project: core
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true
      - ApplyOutOfSyncOnly=true
      - CreateNamespace=true

operators:
  argocd:
    enabled: true
    version: 9.7.1
    namespace: argocd
    repoURL: https://argoproj.github.io/argo-helm
    chart: argo-cd
    values:
      configs:
        params:
          server.insecure: true
      server:
        service:
          type: NodePort
          nodePortHttp: 30080
          nodePortHttps: 30443
      repoServer:
        livenessProbe:
          timeoutSeconds: 10
          initialDelaySeconds: 30
        readinessProbe:
          timeoutSeconds: 10

  authentik:
    enabled: true
    version: 0.0.15
    namespace: authentik
    repoURL: https://mortenolsen.pro/homelab-authentik-operator
    chart: authentik-operator

  cert-manager:
    enabled: true
    version: v1.21.1
    namespace: cert-manager
    repoURL: oci://quay.io/jetstack/charts/cert-manager
    path: .
    values:
      crds:
        enabled: true
      extraArgs:
        - --dns01-recursive-nameservers-only
        - --dns01-recursive-nameservers=8.8.8.8:53,1.1.1.1:53

  external-secrets:
    enabled: true
    version: 2.8.0
    namespace: external-secrets
    repoURL: https://charts.external-secrets.io
    chart: external-secrets
    values:
      installCRDs: true

  cloudnative-pg:
    enabled: true
    version: 0.29.0
    namespace: cloudnative-pg
    repoURL: https://cloudnative-pg.github.io/charts
    chart: cloudnative-pg

  falco:
    enabled: true
    version: 8.0.5
    namespace: falco
    repoURL: https://falcosecurity.github.io/charts
    chart: falco
    values:
      driver:
        kind: modern_ebpf
      collectors:
        containerd:
          enabled: true
          socket: /run/k3s/containerd/containerd.sock
      metrics:
        enabled: true
        interval: 15m
        resource_utilization_enabled: true
        rules_counters_enabled: true
        kernel_event_counters_enabled: true
      webserver:
        enabled: true
      falco:
        json_output: true
        json_include_output_property: true
      serviceMonitor:
        create: true
      customRules:
        custom-rules.yaml: |-
          - macro: allowed_k8s_api_callers
            condition: >
              (k8s.ns.name = "argocd") or
              (k8s.ns.name = "kyverno") or
              (k8s.ns.name = "falco")
          - rule: Contact K8S API Server From Container
            desc: Detect attempts to contact the K8S API Server from a container (with exceptions)
            condition: >
              outbound and
              fd.sip.name="kubernetes.default.svc.cluster.local" and
              container and
              not allowed_k8s_api_callers
            output: >
              Unexpected connection to K8s API Server from container
              (connection=%fd.name lport=%fd.lport rport=%fd.rport
              container_id=%container.id container_name=%container.name
              k8s_pod_name=%k8s.pod.name k8s_ns_name=%k8s.ns.name)
            priority: NOTICE
            source: syscall
            tags: [container, k8s, network, mitre_discovery]
            append: false
          - rule: Run shell untrusted
            override:
              exceptions: append
            exceptions:
              - name: cnpg_wal_archiver
                fields: [container.image.repository, proc.pname]
                comps: [=, =]
                values:
                  - [ghcr.io/cloudnative-pg/postgresql, postgres]
          - rule: Drop and execute new binary in container
            override:
              exceptions: append
            exceptions:
              - name: known_images
                fields: [container.image.repository]
                comps: [=]
                values:
                  - [docker.io/pihole/pihole]
                  - [codeberg.org/forgejo/forgejo]
      falcosidekick:
        enabled: true
        webui:
          enabled: true
        config:
          alertmanager:
            hostport: http://prometheus-operator-kube-p-alertmanager.monitoring.svc.cluster.local:9093
            endpoint: /api/v2/alerts
            minimumpriority: warning
            customseveritymap: "emergency:critical,alert:critical,critical:critical,error:warning,warning:warning,notice:info"

  mariadb-crds:
    enabled: true
    version: 26.6.0
    namespace: mariadb
    repoURL: https://helm.mariadb.com/mariadb-operator
    chart: mariadb-operator-crds

  mariadb-operator:
    enabled: true
    version: 26.6.0
    namespace: mariadb
    repoURL: https://helm.mariadb.com/mariadb-operator
    chart: mariadb-operator

  dns-operator:
    enabled: true
    version: 0.0.8
    namespace: falco
    repoURL: https://morten-olsen.github.io/homelab-dns-operator
    chart: dns-operator

  istio-base:
    enabled: true
    version: 1.30.3
    namespace: istio-system
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: base
    values:
      defaultRevision: default
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istiod-default-validator
        jqPathExpressions:
          - .webhooks[]?.failurePolicy

  istiod:
    enabled: true
    version: 1.30.3
    namespace: istio-system
    repoURL: https://istio-release.storage.googleapis.com/charts
    chart: istiod
    values:
      meshConfig:
        # Enable Ingress support - Istio will handle Kubernetes Ingress resources
        # The gateway service is in the shared namespace (created by gateway chart)
        # Format: namespace/service-name (required when gateway is in different namespace than istio-system)
        ingressService: shared/istio-gateway
        # Match gateway pods with label istio=gateway (matches Gateway CR selector)
        # This tells Istio which gateway pods to use for ingress traffic
        ingressSelector: gateway
        # Enable DNS proxy to intercept DNS queries for mesh-internal hostnames
        # This ensures Istio intercepts DNS queries before they reach public DNS
        defaultConfig:
          proxyMetadata:
            # Enable DNS capture - Istio sidecar will intercept DNS queries
            ISTIO_META_DNS_CAPTURE: "true"
            # DNS auto allocate - automatically assign virtual IPs for ServiceEntry hosts
            ISTIO_META_DNS_AUTO_ALLOCATE: "true"
    ignoreDifferences:
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        name: istio-validator-istio-system
        jqPathExpressions:
          - .webhooks[]?.failurePolicy

  kyverno:
    enabled: true
    version: 3.8.0
    namespace: kyverno
    repoURL: https://kyverno.github.io/kyverno
    chart: kyverno
    values:
      admissionController:
        crdWatcher: true
    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - ServerSideApply=true
        - ApplyOutOfSyncOnly=true
        - CreateNamespace=true
        - RespectIgnoreDifferences=true
        - ServerSideDiff=true
    ignoreDifferences:
      - group: apiextensions.k8s.io
        kind: CustomResourceDefinition
        jqPathExpressions:
          - .metadata.labels
          - .metadata.annotations
      - group: admissionregistration.k8s.io
        kind: MutatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[]?.clientConfig.caBundle
          - .webhooks[]?.failurePolicy
          - .webhooks[]?.rules
      - group: admissionregistration.k8s.io
        kind: ValidatingWebhookConfiguration
        jqPathExpressions:
          - .webhooks[]?.clientConfig.caBundle
          - .webhooks[]?.failurePolicy
          - .webhooks[]?.rules

  nuclei:
    enabled: false
    version: 0.2.9
    namespace: "{{ .Release.Namespace }}"
    repoURL: https://morten-olsen.github.io/homelab-nuclei-operator
    chart: nuclei-operator

  longhorn:
    enabled: false
    version: 1.12.0
    namespace: longhorn
    repoURL: https://charts.longhorn.io
    chart: longhorn
    values:
      defaultSettings:
        defaultReplicaCount: 1
        priorityClass: high-priority

  postgres:
    enabled: true
    version: 0.0.18
    namespace: postgres
    repoURL: https://mortenolsen.pro/homelab-postgres-operator
    chart: postgres-operator

  reflector:
    enabled: true
    version: 10.0.42
    namespace: reflector
    repoURL: oci://ghcr.io/emberstack/helm-charts/reflector
    path: .

  reloader:
    enabled: true
    version: 2.2.11
    namespace: reloader
    repoURL: https://stakater.github.io/stakater-charts
    chart: reloader

  sealed-secrets:
    enabled: true
    version: 2.19.1
    namespace: sealed-secrets
    repoURL: https://bitnami.github.io/sealed-secrets
    chart: sealed-secrets

  trivy:
    enabled: true
    version: 0.34.0
    namespace: trivy
    repoURL: https://aquasecurity.github.io/helm-charts
    chart: trivy-operator
    values:
      serviceMonitor:
        enabled: true
      service:
        headless: false
      trivy:
        resources:
          limits:
            memory: 1Gi

  volsync:
    enabled: true
    version: 0.16.0
    namespace: volsync-system
    repoURL: https://backube.github.io/helm-charts
    chart: volsync
    values:
      metrics:
        disableAuth: true
