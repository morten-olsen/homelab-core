{{- /* Reusable template that generates an ArgoCD Application for a single operator.
       Called once per entry in values.operators by operators.yaml. Each operator entry
       must provide: enabled, version, namespace, repoURL, and either chart or path.
       Optional fields: values (helm overrides), syncPolicy (falls back to global),
       ignoreDifferences (for webhook configs that drift). */ -}}
{{- define "homelab-core.operator" -}}
{{- $name := first . -}}
{{- $root := last . -}}
{{- $global := $root.Values.global -}}
{{- $operator := index $root.Values.operators $name -}}
{{- $syncPolicy := default $global.syncPolicy $operator.syncPolicy -}}
{{- $values := $operator.values -}}
{{- if and (eq $name "argocd") $root.Values.argocdSso.enabled -}}
{{- $values = mergeOverwrite (deepCopy (default dict $operator.values)) (include "homelab-core.argocdSsoValues" $root | fromYaml) -}}
{{- end -}}
{{- if $operator.enabled -}}
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: {{ $name }}
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  destination:
    namespace: {{ $operator.namespace }}
    server: https://kubernetes.default.svc
  project: {{ $global.project }}
  source:
    repoURL: {{ $operator.repoURL }}
    targetRevision: {{ $operator.version }}
    {{- if $operator.chart }}
    chart: {{ $operator.chart }}
    {{- end }}
    {{- if $operator.path }}
    path: {{ $operator.path }}
    {{- end }}
    {{- if $values }}
    helm:
      values: |
        {{- $values | toYaml | nindent 8 }}
    {{- end }}
  syncPolicy:
    {{- toYaml $syncPolicy | nindent 4 }}
  {{- if $operator.ignoreDifferences }}
  ignoreDifferences:
    {{- toYaml $operator.ignoreDifferences | nindent 4 }}
  {{- end }}
{{- end }}
{{- end }}
