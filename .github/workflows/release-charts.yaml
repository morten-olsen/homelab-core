name: Release Charts

on:
  push:
    branches:
      - main
    paths:
      - "charts/**"
      - ".github/workflows/release-charts.yaml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Build chart repository
        run: |
          mkdir -p _site
          curl --fail --silent --show-error --location \
            https://mortenolsen.pro/homelab-core/index.yaml \
            --output previous-index.yaml
          grep -oE 'https://mortenolsen\.pro/homelab-core/[^[:space:]]+\.tgz' previous-index.yaml |
            while read -r url; do
              curl --fail --silent --show-error --location \
                "$url" --output "_site/${url##*/}"
            done
          helm package charts/* --destination _site
          helm repo index _site \
            --merge previous-index.yaml \
            --url https://mortenolsen.pro/homelab-core

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
